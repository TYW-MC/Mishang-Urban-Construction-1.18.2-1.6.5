name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('*.gradle', 'gradle.properties', 'gradle/wrapper/*') }}
          restore-keys: gradle-

      # 覆盖 gradle.properties 中的国内镜像，CI 使用官方源更稳定
      - name: Run datagen
        run: |
          chmod +x gradlew
          ./gradlew runDatagen --stacktrace \
            -Ploom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            -Ploom_fabric_repository=https://maven.fabricmc.net

      - name: Build
        run: |
          ./gradlew build --stacktrace \
            -Ploom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            -Ploom_fabric_repository=https://maven.fabricmc.net

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mishanguc-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/mishanguc-*+mc1.18.2.jar
            build/libs/mishanguc-*-sources.jar
          generate_release_notes: true
